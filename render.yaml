# Render.com Blueprint（HOME INDEX）
# 使い方：GitHubにこのリポジトリを置き、Renderで「New + → Blueprint」から本ファイルを読み込む。
# 環境変数（APIキー）はRenderのダッシュボードで設定する（このファイルには書かない）。
services:
  - type: web
    name: home-index
    runtime: python
    plan: free                # 無料枠（一定時間アクセスが無いとスリープ／初回アクセスは起動待ち）
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: REINFOLIB_KEY
        sync: false           # ダッシュボードで手入力（値はコミットしない）
      - key: ESTAT_APPID
        sync: false
      - key: ESTAT_TABLE
        value: "0000020201"
      - key: GOOGLE_KEY       # 使う場合のみ。未設定ならGSI（無料）を使用
        sync: false
      # --- アカウント機能。未設定ならログイン・保存・比較は丸ごと隠れる ---
      - key: DATABASE_URL        # Neon の接続文字列（postgresql://...）
        sync: false
      - key: SECRET_KEY          # セッションの署名鍵。変えると全員ログアウトになる
        generateValue: true
      - key: RESEND_API_KEY      # ログイン用リンクの送信に使う
        sync: false
      - key: MAIL_FROM           # 例）HOME INDEX <login@example.com>
        sync: false
      # --- 有料プラン。5つすべて揃うまで課金の画面は出ない ---
      - key: BILLING_ENABLED    # "1" で有効。課金開始日が決まってから立てる
        sync: false
      # 氏名だけを入れる。屋号や肩書きは混ぜない（画面側で併記している）
      - key: OPERATOR_NAME      # 特商法：個人事業者は戸籍上の氏名
        sync: false
      - key: OPERATOR_ADDRESS   # 特商法：省略できない
        sync: false
      - key: OPERATOR_TEL       # 特商法：省略できない
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CANONICAL_HOST    # 独自ドメイン（例 home-index.jp）。未設定なら転送しない
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
